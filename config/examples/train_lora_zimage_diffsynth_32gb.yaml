---
# Z-Image DiffSynth — LoRA training (32GB VRAM)
# Uses DiffSynth DiT/forward; model and datasets from main project.
# process.type: z_image_diffsynth_trainer, model.arch: zimage_diffsynth.
# Optional: sampling_name_or_path (Turbo for fast sampling), quantize, quantize_te.
job: extension
config:
  name: "my_zimage_diffsynth_lora_v1"
  process:
    - type: "z_image_diffsynth_trainer"
      training_folder: "output"
      device: cuda:0
      network:
        type: "lora"
        dtype: fp32
        linear: 128
        linear_alpha: 128
      save:
        dtype: bf16
        save_every: 500
        max_step_saves_to_keep: 6
        save_format: safetensors
      datasets:
        - folder_path: "/path/to/images/folder"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [ 1024, 1024 ]
      train:
        batch_size: 2
        gradient_accumulation: 1
        steps: 3000
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        timestep_type: "sigmoid"
        timestep_weighting: "weighted"
        content_or_style: "balanced"
        loss_type: "mse"
        dtype: bf16
        optimizer: "prodigy"
        lr: 1.0
        optimizer_params:
          weight_decay: 0.01
        lr_scheduler: "constant"
        unload_text_encoder: false
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: false
        disable_sampling: false
      logging:
        log_every: 1
        use_ui_logger: true
      model:
        name_or_path: "Tongyi-MAI/Z-Image"
        arch: "zimage_diffsynth"
        dtype: bf16
        # Optional: Turbo for fewer-step sampling
        # sampling_name_or_path: "Tongyi-MAI/Z-Image-Turbo"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
        model_kwargs:
          # use_diffsynth_training_loop: false
          # use_diffsynth_prompt_encoding: true
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        samples:
          - prompt: "[trigger], studio portrait, soft lighting"
          - prompt: "[trigger] on a beach, golden hour"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 30
meta:
  name: "[name]"
  version: "1.0"
