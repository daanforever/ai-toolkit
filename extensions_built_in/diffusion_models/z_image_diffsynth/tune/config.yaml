job: "extension"
config:
  name: "zdiffsynth"
  process:
    - type: "z_image_diffsynth_trainer"
      log_dir: "./output/TensorBoard"
      training_folder: "./output"
      sqlite_db_path: "./aitk_db.db"
      device: "cuda"
      trigger_word: null
      performance_log_every: 10
      network:
        pretrained_lora_path: ""
        dtype: "fp32"
        rank_dropout: 0
        type: "lora"
        linear: 128
        linear_alpha: 128
        conv: 0
        conv_alpha: 0
        lokr_full_rank: false
        lokr_factor: -1
        network_kwargs:
          ignore_if_contains:
            - "noise_refiner"
            - "context_refiner"
            - "all_final_layer"
      save:
        dtype: "bf16"
        save_every: 100
        max_step_saves_to_keep: 2
        save_format: "safetensors"
        push_to_hub: false
      train:
        turbo_prior_steps: 8
        turbo_t_jitter: 0.5
        turbo_teacher_weight: true
        lr: 0.0001
        min_snr_gamma: 0
        timestep_weighting: "none"
        batch_size: 1
        gradient_accumulation: 1
        noise_scheduler: "flowmatch"
        prediction_type: "flowmatch"
        timestep_type: "turbo_prior"
        content_or_style: "balanced"
        gaussian_mean: 1000
        gaussian_std: 0.55
        gaussian_mean_2: 120
        gaussian_std_2: 0.59
        gaussian_shift: 0.01
        bypass_guidance_embedding: false
        steps: 30000
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        optimizer: "adafactor"
        optimizer_params:
          scale_lr_by_index: true
          scale_lr_factor: 1.2
          beta2: 0.99
          beta2_adaptive: false
          beta2_min: 0.9
          weight_decay: 0.01
          scale_parameter: false
          relative_step: false
          warmup_init: true
          warmup_steps: 100
          warmup_boost: 1
          rms_max_decay_rate: 0.99
          stochastic_accumulation: true
          stochastic_rounding: true
          factored: true
          beta1: 0
          weight_decay_mode: "absolute"
          weight_decay_increment: 0
        unload_text_encoder: false
        cache_text_embeddings: true
        ema_config:
          use_ema: false
          ema_decay: 0.99
        skip_first_sample: false
        force_first_sample: false
        disable_sampling: false
        dtype: "fp32"
        diff_output_preservation: false
        diff_output_preservation_multiplier: 1
        diff_output_preservation_class: "person"
        loss_type: "mse"
        blank_prompt_preservation: false
        blank_prompt_probability: 1
        blank_prompt_preservation_multiplier: 1
      logging:
        log_every: 1
        use_ui_logger: true
        debug: false
      model:
        dtype: "bf16"
        compile: false
        debug_zimage_load: false
        name_or_path: "e:/Backup/huggingface/hub/models--Tongyi-MAI--Z-Image/snapshots/04cc4abb7c5069926f75c9bfde9ef43d49423021/"
        sampling_name_or_path: "e:/Backup/huggingface/hub/models--Tongyi-MAI--Z-Image-Turbo/snapshots/0e36c2b379e66fa531d01cc531c44919e5f1c6fd/"
        quantize: true
        qtype: "qfloat8"
        quantize_te: true
        qtype_te: "qfloat8"
        arch: "zimage_diffsynth"
        low_vram: false
        model_kwargs:
          loader: "diffsynth"
          use_dynamic_shifting: false
          use_diffsynth_training_loop: false
          disable_noise_refiner: false
          disable_context_refiner: false
        layer_offloading: false
        layer_offloading_text_encoder_percent: 1
        layer_offloading_transformer_percent: 1
      datasets:
        - folder_path: "./datasets/"
          tone_correction: false
          square_crop: false
          mask_path: null
          mask_min_value: 0.1
          default_caption: "dog"
          caption_ext: "txt"
          caption_dropout_rate: 0
          caption_dropout_keep: 0
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution:
            - 1024
          controls: []
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
      sample:
        sample_noised: true
        sampler: "flowmatch"
        sample_every: 100
        width: 1024
        height: 768
        samples:
          - prompt: "dog"
        neg: ""
        seed: 4
        walk_seed: false
        guidance_scale: 0
        sample_steps: 8
        num_frames: 1
        fps: 1
      tune:
        step_timeout_s: 30.0
        load_budget_s: 180
        sample_budget_s: 60
        turbo_teacher_weight: true
        lrs: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
        stages: [a, b, c]
        promote_top_k: {a: 3, b: 2}
        clip_model: ViT-B-32
        clip_pretrained: laion2b_s34b_b79k
        instability_max: 1.0
        lpips_dead: 0.04
        safe_range: 100
        lpips_boom: 0.45
        a:
          checkpoints: [10, 100]
          warmup_steps: 8
          linear: 4
          resolution: 512
          sample_width: 256
          sample_height: 256
          dataset: one_ref
        b:
          checkpoints: [10, 100, 1000]
          warmup_steps: 30
          linear: 128
          resolution: 512
          sample_width: 512
          sample_height: 512
          dataset: recipe
        c:
          checkpoints: [100, 1000]
          warmup_steps: 100
          linear: 128
          dataset: recipe
